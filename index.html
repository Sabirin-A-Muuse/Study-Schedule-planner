
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Study Schedule Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      margin: 0;
      padding: 30px;
      color: #243047;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000012;
    }

    h1 { color: #4056a1; }

    input, select, button {
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      width: 100%;
    }

    button {
      background: #4056a1;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover { background: #304080; }

    .course {
      background: #f0f3fa;
      padding: 15px;
      margin: 12px 0;
      border-radius: 8px;
    }

    #results {
      margin-top: 20px;
      padding: 15px;
      background: #edf7ef;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Smart Study Schedule Generator</h1>
    <p>Organize your courses and create a personalized
       weekly study schedule using AI.</p>

    <h2>Your Courses</h2>
    <div id="courses"></div>

    <button onclick="addCourse()">+ Add Course</button>

    <h2>Study Availability</h2>
    <label for="hours">Hours available per week</label>
    <input type="number" id="hours" min="1" max="168"
           placeholder="Example: 15">

    <button onclick="generateSchedule()">
      Generate My Study Schedule
    </button>

    <div id="results"></div>
  </div>

  <script>
    function addCourse() {
      const container = document.getElementById("courses");

      const div = document.createElement("div");
      div.className = "course";

      div.innerHTML = `
        <input class="course-name"
               placeholder="Course name (e.g. STAT 321)">

        <label>Difficulty</label>
        <select class="difficulty">
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>

        <label>Next assignment or exam date</label>
        <input type="date" class="deadline">

        <button type="button" onclick="this.parentElement.remove()">
          Remove Course
        </button>
      `;

      container.appendChild(div);
    }

    function generateSchedule() {
      const hours = Number(document.getElementById("hours").value);
      const courses = document.querySelectorAll(".course");
      const results = document.getElementById("results");

      results.style.display = "block";

      if (!Number.isFinite(hours) || hours <= 0 ||
          hours > 168 || courses.length === 0) {
        results.textContent =
          "Please add a course and enter valid study hours.";
        return;
      }

      for (const course of courses) {
        if (!course.querySelector(".course-name").value.trim()) {
          results.textContent =
            "Please enter a name for every course.";
          return;
        }
      }

      results.textContent =
        "Your courses were collected successfully! " +
        "Gemini AI will be connected in a later step.";
    }

    addCourse();
  </script>
</body>
</html>
